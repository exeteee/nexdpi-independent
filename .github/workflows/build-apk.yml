name: NexDPI Android APK

on:
  push:
    paths:
      - 'NexDPI-independent-source-proxy.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Extract project and fetch pinned native engine
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NexDPI-independent-source-proxy.zip"
          test -f "$ARCHIVE" || { echo "::error::ZIP archive is missing from repository root."; exit 1; }
          EXTRACT_DIR="$RUNNER_TEMP/nexdpi-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"
          PROJECT_DIR="$(find "$EXTRACT_DIR" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found inside the ZIP."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"
          BYEDPI_DIR="$PROJECT_DIR/app/src/main/cpp/byedpi"
          git init "$BYEDPI_DIR"
          git -C "$BYEDPI_DIR" remote add origin https://github.com/hufrea/byedpi.git
          git -C "$BYEDPI_DIR" fetch --depth 1 origin e2684772fbda45f2ff4fc220922a010370534216
          git -C "$BYEDPI_DIR" checkout --quiet FETCH_HEAD
          test -f "$BYEDPI_DIR/LICENSE"
          mkdir -p "$PROJECT_DIR/app/src/main/assets/licenses"
          cp "$BYEDPI_DIR/LICENSE" "$PROJECT_DIR/app/src/main/assets/licenses/BYEDPI-MIT-LICENSE.txt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Pinned hufrea/byedpi commit: e2684772fbda45f2ff4fc220922a010370534216"

      - name: Build and run tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexDPI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
