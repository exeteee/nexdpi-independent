name: NexDPI Android APK

on:
  push:
    paths:
      - 'NexDPI-independent-source-proxy.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Extract ZIP, apply dependency compatibility fix, test and build APK
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/NexDPI-independent-source-proxy.zip"
          test -f "$ARCHIVE" || { echo "::error::ZIP archive is missing from repository root."; exit 1; }
          EXTRACT_DIR="$RUNNER_TEMP/nexdpi-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"
          PROJECT_DIR="$(find "$EXTRACT_DIR" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found inside the ZIP archive."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$BUILD_FILE" || { echo "::error::app/build.gradle.kts is missing."; exit 1; }
          test -d "$PROJECT_DIR/app/src" || { echo "::error::app/src folder is missing."; exit 1; }
          python3 - "$BUILD_FILE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          pattern = r"com\.squareup\.okhttp3:okhttp(?:-android)?:5\.5\.1"
          updated, count = re.subn(pattern, "com.squareup.okhttp3:okhttp:4.12.1", text)
          if count == 0:
              print("Could not find the expected OkHttp 5.5.1 dependency. Lines mentioning okhttp:")
              for line in text.splitlines():
                  if "okhttp" in line.lower(): print(line)
              raise SystemExit("Dependency patch did not apply; stopping to avoid a misleading build.")
          p.write_text(updated, encoding="utf-8")
          print(f"Updated {count} OkHttp dependency declaration(s) to 4.12.1")
          PY
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexDPI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
